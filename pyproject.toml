[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ativos-cli"
version = "1.1.0"
description = "CLI para acompanhar datas-com e rendimentos de FIIs (fonte: fiis.com.br)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Gabriel Richard" }]
keywords = ["fii", "fundos imobiliarios", "cli", "dividendos"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "scrapy>=2.13",
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0.40",
    "pydantic>=2.6",
    "platformdirs>=4.0",
]

[project.scripts]
ativos = "ativos_cli.main:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/ativos_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: testes de integração que acessam o fiis.com.br"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "B008"]

[tool.uv]
# Por padrão o uv só reconstrói o pacote local quando o pyproject.toml muda;
# assim, qualquer alteração no código também invalida o cache do `uv tool install`.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
